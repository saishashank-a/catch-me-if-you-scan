# SkillSpector baseline (static, --no-llm, scanner 2.12.0). Reviewed manually; all false positives.
# Use: skillspector scan . --no-llm --use-shipped-baseline
# Rules match rule id + file + matched text, so unrelated edits to these files don't break them.
version: 2
rules:
  - id: RP1
    path: README.md
    message: "*npx playwright*"
    reason: >-
      The `npx playwright install chromium` hint downloads a browser; it is not an
      MCP server. The bundled MCP servers in .mcp.json are pinned (@playwright/mcp@0.0.83).
  - id: AS3
    path: README.md
    message: "*skills/catch-me-if-you-scan/SKILL.md*"
    reason: >-
      README "What's inside" lists this plugin's own files. Documentation, not
      enumeration of other installed skills.
  - id: EA2
    path: plugins/catch-me-if-you-scan/skills/catch-me-if-you-scan/SKILL.md
    message: "*without confirmation*"
    reason: >-
      Matched inside the safety rule that forbids action: stay read-only on production
      (no payments, deletions, messages) and never file tickets without confirmation.
  - id: EA2
    path: plugins/catch-me-if-you-scan/skills/catch-me-if-you-scan/references/bug-report.md
    message: "*without asking*"
    reason: >-
      Bug-writing guidance: a developer should be able to verify the fix without asking
      the reporter. Describes report quality, not agent autonomy.
